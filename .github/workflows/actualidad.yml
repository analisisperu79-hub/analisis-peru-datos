name: Actualizar actualidad económica

on:
  schedule:
    # 13:00 UTC = 08:00 Perú
    - cron: "0 13 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_actualidad.txt

      - name: Actualizar actualidad
        run: |
          python scripts/actualizar_actualidad.py

      - name: Guardar cambios
        run: |
          git config user.name "analisis-peru-bot"
          git config user.email "actions@github.com"

          git add actualidad.json

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos."
          else
            git commit -m "Actualizar actualidad económica"
            git push
          fi
